{% extends "base.html" %}

{% block title %}Something Went Wrong - Jai Malhar Retail Store{% endblock %}

{% block content %}

<section class="error-page">
    <div class="container error-container">

        <div class="error-icon">
            ⚠️
        </div>

        <h1>500</h1>

        <h2>Something Went Wrong</h2>

        <p>
            Sorry, something went wrong on our side.
            Please try again later.
        </p>

        <a href="{{ url_for('customer.index') }}" class="primary-btn">
            🏠 Back to Store
        </a>

    </div>
</section>

{% endblock %}
